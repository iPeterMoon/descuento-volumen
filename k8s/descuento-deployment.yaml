apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
    kompose.image-pull-policy: IfNotPresent
    kompose.service.healthcheck.readiness.tcp_port: "8080"
    kompose.service.type: nodeport
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: descuento
  name: descuento
spec:
  replicas: 2
  selector:
    matchLabels:
      io.kompose.service: descuento
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o k8s/
        kompose.image-pull-policy: IfNotPresent
        kompose.service.healthcheck.readiness.tcp_port: "8080"
        kompose.service.type: nodeport
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: descuento
    spec:
      containers:
        - env:
            - name: APP_VERSION
              value: k8s-v2
          image: descuento-volumen:1.0.0
          imagePullPolicy: IfNotPresent
          name: descuento
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8080
      restartPolicy: Always
